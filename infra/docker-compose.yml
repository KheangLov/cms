name: cms

x-backend-image: &backend-image
  build:
    context: ../backend
    args:
      REQUIREMENTS_FILE: requirements/dev.txt
  env_file:
    - ../.env
  depends_on:
    postgres:
      condition: service_healthy
    valkey:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - ../backend:/app

services:
  postgres:
    image: postgres:18-alpine
    env_file: [../.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms}
    volumes:
      # Postgres 18+ images expect the mount one level up from "data" — see
      # https://github.com/docker-library/postgres/pull/1259. Discovered at Phase 0.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey, not Redis — CMS_BUILD_PROMPT.md §2 on why. Wire-compatible, so every client
  # library (django-redis, celery, channels-redis) just points at REDIS_URL as normal.
  valkey:
    image: valkey/valkey:9.1-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: [../.env]
    volumes:
      - minio_data:/data
    ports:
      # Host-side only — 9000/9001 are already taken by an unrelated project's MinIO
      # on this machine, discovered at Phase 0. Internal container port stays 9001;
      # only the host mapping moves.
      - "9091:9001" # console
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the media bucket and makes it public-read for local dev, then exits.
  minio-init:
    image: minio/mc:latest
    env_file: [../.env]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/$$AWS_STORAGE_BUCKET_NAME &&
      mc anonymous set download local/$$AWS_STORAGE_BUCKET_NAME &&
      exit 0
      "
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      RUN_MIGRATIONS: "1" # the only service allowed to run migrate — see entrypoint.sh
    ports:
      # Host-side only — port 8000 is already taken by an unrelated project on this
      # machine, discovered at Phase 0. Container still serves on 8000 internally
      # (that's what the frontend's NUXT_API_BASE_INTERNAL points at).
      - "8010:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  celery-worker:
    <<: *backend-image
    command: celery -A config worker -l info
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  celery-beat:
    <<: *backend-image
    command: celery -A config beat -l info
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    env_file:
      - ../.env
    environment:
      NUXT_API_BASE_INTERNAL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

volumes:
  postgres_data:
  valkey_data:
  es_data:
  minio_data:
  frontend_node_modules:
